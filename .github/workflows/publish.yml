name: publish

on:
  workflow_call:
    inputs:
      ref:
        description: Release tag to verify and publish, e.g. livekit-plugins-reson8-v0.2.1
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to verify and publish, e.g. livekit-plugins-reson8-v0.2.1
        type: string
        required: true

permissions: {}

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.ref }}

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-publish-${{ inputs.ref }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/livekit-plugins-reson8
    permissions:
      id-token: write
    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Check the distributions match the release tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            *-v[0-9]*) tag_version="${REF##*-v}" ;;
            *) echo "::error::'$REF' is not a release tag (expected <package>-vX.Y.Z)"; exit 1 ;;
          esac
          sdist=$(basename "$(ls dist/*.tar.gz)" .tar.gz)
          dist_version="${sdist##*-}"
          if [ "$tag_version" != "$dist_version" ]; then
            echo "::error::tag is $tag_version but the built distribution is $dist_version"
            exit 1
          fi
          echo "Publishing $dist_version from $REF"
          ls -l dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
